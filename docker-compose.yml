version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
    restart: unless-stopped
    networks:
      - syncdraw-net

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        - VITE_WS_URL=http://localhost:8080
        - VITE_GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - syncdraw-net

networks:
  syncdraw-net:
    driver: bridge
